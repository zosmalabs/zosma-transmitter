name: Compilar para Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Baixar o código
        uses: actions/checkout@v5

      - name: Configurar o projeto
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Compilar
        run: cmake --build build --config Release --parallel

      - name: Obter o runtime NDI validado na versão 0.3.1
        timeout-minutes: 5
        shell: pwsh
        run: |
          $ProgressPreference = "SilentlyContinue"
          $packagePath = "$env:RUNNER_TEMP\zosma-v0.3.1.zip"
          $ndiRuntimeDir = "$env:RUNNER_TEMP\ndi-runtime"
          Invoke-WebRequest `
            -Uri "https://github.com/zosmalabs/zosma-transmitter/releases/download/v0.3.1-beta/Zosma-Transmitter-v0.3.1-beta-Windows-x64.zip" `
            -OutFile $packagePath
          Expand-Archive -Path $packagePath -DestinationPath $ndiRuntimeDir -Force

      - name: Montar pacote portátil
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null

          Copy-Item `
            "build\Release\Zosma Transmitter.exe" `
            "dist\Zosma Transmitter.exe"

          $ndiDll = Get-ChildItem `
            -Path "$env:RUNNER_TEMP\ndi-runtime" `
            -Filter "Processing.NDI.Lib.x64.dll" `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $ndiDll) {
            throw "A DLL redistribuível do NDI não foi localizada."
          }

          Copy-Item `
            $ndiDll.FullName `
            "dist\Processing.NDI.Lib.x64.dll"

          Copy-Item "README-TESTE.txt" "dist\LEIA-ME.txt"
          Copy-Item "THIRD_PARTY_NOTICES.md" "dist\AVISOS-DE-TERCEIROS.txt"

      - name: Publicar artifact de teste
        uses: actions/upload-artifact@v4
        with:
          name: Zosma-Transmitter-Windows-x64
          path: dist/*
          if-no-files-found: error
          retention-days: 30
