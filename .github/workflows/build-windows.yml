name: Compilar para Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Baixar o código
        uses: actions/checkout@v5

      - name: Configurar o projeto
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Compilar
        run: cmake --build build --config Release --parallel

      - name: Obter o runtime NDI validado na versão 0.3.1
        timeout-minutes: 5
        shell: pwsh
        run: |
          $ProgressPreference = "SilentlyContinue"
          $packagePath = "$env:RUNNER_TEMP\zosma-v0.3.1.zip"
          $ndiRuntimeDir = "$env:RUNNER_TEMP\ndi-runtime"
          Invoke-WebRequest `
            -Uri "https://github.com/zosmalabs/zosma-transmitter/releases/download/v0.3.1-beta/Zosma-Transmitter-v0.3.1-beta-Windows-x64.zip" `
            -OutFile $packagePath
          Expand-Archive -Path $packagePath -DestinationPath $ndiRuntimeDir -Force

      - name: Montar pacotes portáteis
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-transmitter | Out-Null
          New-Item -ItemType Directory -Force -Path dist-receiver | Out-Null

          Copy-Item `
            "build\Release\Zosma Transmitter.exe" `
            "dist-transmitter\Zosma Transmitter.exe"

          Copy-Item `
            "build\Release\Zosma Receiver.exe" `
            "dist-receiver\Zosma Receiver.exe"

          $ndiDll = Get-ChildItem `
            -Path "$env:RUNNER_TEMP\ndi-runtime" `
            -Filter "Processing.NDI.Lib.x64.dll" `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $ndiDll) {
            throw "A DLL redistribuível do NDI não foi localizada."
          }

          Copy-Item `
            $ndiDll.FullName `
            "dist-transmitter\Processing.NDI.Lib.x64.dll"

          Copy-Item `
            $ndiDll.FullName `
            "dist-receiver\Processing.NDI.Lib.x64.dll"

          Copy-Item "README-TESTE.txt" "dist-transmitter\LEIA-ME.txt"
          Copy-Item "README-RECEIVER-TESTE.txt" "dist-receiver\LEIA-ME.txt"
          Copy-Item "THIRD_PARTY_NOTICES.md" "dist-transmitter\AVISOS-DE-TERCEIROS.txt"
          Copy-Item "THIRD_PARTY_NOTICES.md" "dist-receiver\AVISOS-DE-TERCEIROS.txt"

      - name: Publicar artifact de teste
        uses: actions/upload-artifact@v4
        with:
          name: Zosma-Transmitter-Windows-x64
          path: dist-transmitter/*
          if-no-files-found: error
          retention-days: 30

      - name: Publicar artifact de teste do Receiver
        uses: actions/upload-artifact@v4
        with:
          name: Zosma-Receiver-Windows-x64
          path: dist-receiver/*
          if-no-files-found: error
          retention-days: 30

      - name: Compactar pacote da release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "dist-transmitter\*" `
            -DestinationPath "Zosma-Transmitter-${{ github.ref_name }}-Windows-x64.zip" `
            -Force

          Compress-Archive `
            -Path "dist-receiver\*" `
            -DestinationPath "Zosma-Receiver-${{ github.ref_name }}-Windows-x64.zip" `
            -Force

      - name: Anexar pacote à release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $transmitterAsset = "Zosma-Transmitter-$tag-Windows-x64.zip"
          $receiverAsset = "Zosma-Receiver-$tag-Windows-x64.zip"

          for ($attempt = 1; $attempt -le 12; $attempt++) {
            gh release view $tag --repo "${{ github.repository }}" 2>$null
            if ($LASTEXITCODE -eq 0) {
              gh release upload $tag $transmitterAsset $receiverAsset `
                --repo "${{ github.repository }}" `
                --clobber
              exit $LASTEXITCODE
            }
            Start-Sleep -Seconds 5
          }

          throw "A release $tag não ficou disponível a tempo para receber o pacote."
